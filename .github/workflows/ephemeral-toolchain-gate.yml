name: Ephemeral toolchain gate

on:
  push:
    branches:
      - audit/003-toolchain-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export-fix-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Generate Ruff fix candidate
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix --unsafe-fixes || true
          git diff -- src tests > ruff-full-fix.patch
          rm -rf fix-candidate
          mkdir -p fix-candidate
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', 'src', 'tests'],
              text=True,
          ).splitlines()
          for item in changed:
              source = Path(item)
              target = Path('fix-candidate') / item
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print('\n'.join(changed))
          PY
          git diff --check
          echo '--- remaining Ruff findings ---'
          ruff check . || true
          echo '--- mypy findings ---'
          mypy src || true

      - name: Upload full Ruff patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-full-fix-patch
          path: ruff-full-fix.patch
          if-no-files-found: error

      - name: Upload exact full-fix files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-full-fix-files
          path: fix-candidate
          if-no-files-found: error
