name: Ephemeral toolchain gate

on:
  push:
    branches:
      - audit/003-toolchain-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export-safe-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Apply safe Ruff fixes and export exact files
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix || true
          rm -rf autofix-files
          mkdir -p autofix-files
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', 'src', 'tests'],
              text=True,
          ).splitlines()
          for item in changed:
              source = Path(item)
              target = Path('autofix-files') / item
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print('\n'.join(changed))
          PY
          git diff --check
          echo '--- remaining Ruff findings ---'
          ruff check . || true
          echo '--- mypy findings ---'
          mypy src || true

      - name: Upload exact safe-fixed files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-safe-files
          path: autofix-files
          if-no-files-found: error
