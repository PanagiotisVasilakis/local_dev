name: Ephemeral toolchain gate

on:
  push:
    branches:
      - audit/003-toolchain-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Generate safe Ruff autofix patch
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix || true
          git diff -- src tests > ruff-autofix.patch
          echo '--- remaining Ruff findings ---'
          ruff check . || true
          echo '--- mypy findings ---'
          mypy src || true

      - name: Upload Ruff autofix patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-autofix
          path: ruff-autofix.patch
          if-no-files-found: error
